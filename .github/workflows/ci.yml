name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm comes from the "packageManager" field in package.json.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The web client (second Vite build of apps/desktop, served by Caddy on the VM) must build;
      # Deploy Oracle rebuilds it on its own runner from the same commit.
      - run: pnpm --filter @concord/desktop build:web

  # The jam bot (Go). Deploy Oracle only runs after a fully green CI, so this job also gates it.
  jam-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jam-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/jam-bot/go.mod
          cache-dependency-path: apps/jam-bot/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted (run gofmt -w .):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      # The production VM is linux/arm64 (Ampere A1) and the image is distroless static.
      - name: Cross-build for the VM (linux/arm64, static)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -o /dev/null .
