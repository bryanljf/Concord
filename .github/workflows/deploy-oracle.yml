name: Deploy Oracle

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: concord-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Stays off until the repository variable ORACLE_DEPLOY_ENABLED is "true".
    # Automatic deploys only follow a successful CI run of a PUSH to main of THIS repository:
    # CI also runs for pull requests, and a fork's PR from a branch named "main" would otherwise
    # satisfy head_branch == 'main' and trigger a deploy with the production secrets.
    if: >-
      vars.ORACLE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    # The public URL is deliberately not written here (public repo): it comes from a secret.
    environment: production
    steps:
      # The jam bot is never compiled on the VM (a cold Go build there takes ~10 min of its single
      # OCPU): it is cross-compiled here, from the commit that passed CI, and sent over SSH; the
      # VM's image only copies apps/jam-bot/dist/jam-bot-linux-arm64 (untracked, so the deploy
      # script's git reset keeps it). workflow_run has no head_sha on a manual run: github.sha then.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/jam-bot/go.mod
          cache-dependency-path: apps/jam-bot/go.sum

      - name: Build the jam bot (linux/arm64, static)
        working-directory: apps/jam-bot
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -o jam-bot-linux-arm64 .
          ls -l jam-bot-linux-arm64
          sha256sum jam-bot-linux-arm64

      # The web app (a second Vite build of apps/desktop: static files served by Caddy) is also
      # built here, never on the VM (no Node there). ELECTRON_SKIP_BINARY_DOWNLOAD: the install
      # runs Electron's postinstall but skips the ~100 MB binary, which this build never needs.
      # Same pnpm store cache as CI, so the install is usually a cache hit.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Build the web app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @concord/desktop build:web
          test -f apps/desktop/out/web/index.html
          du -sh apps/desktop/out/web

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/concord_oracle
          chmod 600 ~/.ssh/concord_oracle
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Streamed into a temporary file, checked against the local hash, then renamed over the old
      # binary (atomic), so a build on the VM never sees a half-written file.
      - name: Upload the jam bot binary
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${ORACLE_SSH_PORT:-22}"
          user="${ORACLE_USER:-ubuntu}"
          binary=apps/jam-bot/jam-bot-linux-arm64
          sum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          ssh -i ~/.ssh/concord_oracle -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$user@$ORACLE_HOST" \
            "set -eu
            mkdir -p ~/concord/apps/jam-bot/dist
            cd ~/concord/apps/jam-bot/dist
            cat > .jam-bot-linux-arm64.upload
            echo '$sum  .jam-bot-linux-arm64.upload' | sha256sum --check --quiet
            chmod 755 .jam-bot-linux-arm64.upload
            mv -f .jam-bot-linux-arm64.upload jam-bot-linux-arm64" \
            < "$binary"

      # Packed on the runner and streamed over SSH into ~/concord/web/.incoming (hash checked,
      # index.html must be there), then swapped into ~/concord/web/current with two renames: a
      # failed upload never leaves an empty site, and the folder only ever holds one build (the
      # previous one is deleted right after the swap; nothing accumulates). Caddy serves
      # web/current straight from the bind mount, so the new build is live as soon as the rename
      # lands; the deploy script below only reloads Caddy when the Caddyfile itself changed.
      - name: Upload the web app
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${ORACLE_SSH_PORT:-22}"
          user="${ORACLE_USER:-ubuntu}"
          tar -C apps/desktop/out/web -czf web.tgz .
          sum="$(sha256sum web.tgz | cut -d ' ' -f 1)"
          ssh -i ~/.ssh/concord_oracle -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$user@$ORACLE_HOST" \
            "set -eu
            mkdir -p ~/concord/web
            cd ~/concord/web
            rm -rf .incoming .incoming.tgz previous
            mkdir .incoming
            cat > .incoming.tgz
            echo '$sum  .incoming.tgz' | sha256sum --check --quiet
            tar -C .incoming -xzf .incoming.tgz
            rm -f .incoming.tgz
            test -f .incoming/index.html
            if [ -d current ]; then mv current previous; fi
            mv .incoming current
            rm -rf previous
            du -sh current" \
            < web.tgz

      - name: Deploy Concord
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${ORACLE_SSH_PORT:-22}"
          user="${ORACLE_USER:-ubuntu}"
          ssh -i ~/.ssh/concord_oracle -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$user@$ORACLE_HOST" \
            'bash ~/concord/infra/scripts/deploy-oracle.sh'

      - name: Verify public health endpoint
        env:
          # Secret, so it is masked in the (public) Actions logs.
          CONCORD_PUBLIC_URL: ${{ secrets.CONCORD_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test -n "$CONCORD_PUBLIC_URL"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            "$CONCORD_PUBLIC_URL/api/health" > /dev/null
          # The web app: the root must answer 200 with HTML (index.html served by Caddy from
          # web/current). Only the content type is printed, never the URL (it is a secret).
          content_type="$(curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            --output /dev/null --write-out '%{content_type}' "$CONCORD_PUBLIC_URL/")"
          case "$content_type" in
            text/html*) ;;
            *) echo "unexpected Content-Type for /: $content_type" >&2; exit 1 ;;
          esac
