name: Release

# Pushing a tag such as v0.1.0 builds the Windows installer and uploads it, with the
# latest.yml electron-updater needs, to a GitHub release for that tag.
#
# electron-builder publishes the release immediately (releaseType: release in electron-builder.yml)
# so the installed apps start seeing the update. The tag must match "version" in
# apps/desktop/package.json (checked below).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm comes from the "packageManager" field in package.json.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Check that the tag matches apps/desktop/package.json
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Prebuild the native audio addon (when the package defines it)
        shell: bash
        run: |
          if node -e "process.exit(require('./packages/process-audio/package.json').scripts?.prebuild ? 0 : 1)"; then
            pnpm --filter @concord/process-audio run prebuild
          else
            echo "@concord/process-audio has no prebuild script; skipping"
          fi

      - name: Package and publish the installer
        run: pnpm --filter @concord/desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
