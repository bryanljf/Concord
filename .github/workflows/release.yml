name: Release

# Pushing a tag such as v0.1.0 builds the Windows installer and uploads it, with the
# latest.yml electron-updater needs, to a GitHub release for that tag.
#
# electron-builder publishes the release immediately (releaseType: release in electron-builder.yml)
# so the installed apps start seeing the update. The tag must match "version" in
# apps/desktop/package.json (checked below).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Pre-fills the server URL in the onboarding of released builds. Override with the
      # repository variable CONCORD_DEFAULT_SERVER if the domain changes.
      VITE_DEFAULT_SERVER: ${{ vars.CONCORD_DEFAULT_SERVER || 'https://exemplo.duckdns.org' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm comes from the "packageManager" field in package.json.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Check that the tag matches apps/desktop/package.json
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Prebuild the native audio addon (when the package defines it)
        shell: bash
        run: |
          if node -e "process.exit(require('./packages/process-audio/package.json').scripts?.prebuild ? 0 : 1)"; then
            pnpm --filter @concord/process-audio run prebuild
          else
            echo "@concord/process-audio has no prebuild script; skipping"
          fi

      # electron-builder's own GitHub publisher raced on release creation and exited before the
      # 116 MB installer finished uploading, so the upload is done explicitly with the gh CLI.
      - name: Package the installer
        run: pnpm --filter @concord/desktop exec electron-builder --win --publish never

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd apps/desktop/release
          ls -la Concord-Setup-*.exe Concord-Setup-*.exe.blockmap latest.yml
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              Concord-Setup-*.exe Concord-Setup-*.exe.blockmap latest.yml
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Concord $version" --generate-notes \
              Concord-Setup-*.exe Concord-Setup-*.exe.blockmap latest.yml
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
