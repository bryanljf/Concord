# =============================================================================================
#  Concord em produção na VM Oracle (Fase 5) — PREPARADO, AINDA NÃO EXECUTADO
# =============================================================================================
# Escrito sem Docker disponível: nenhum `docker compose` daqui foi executado ainda. O passo a
# passo (pré-checagem da VM, DNS, firewall, Docker, .env, users.json, validação e, obrigatório,
# conferir que o Minecraft continua no ar) está em infra/README-deploy.md.
# Toda ação na VM exige confirmação do usuário antes.
#
# Subir, a partir da raiz do repositório clonado na VM:
#   docker compose -f infra/docker-compose.yml up -d --build
# (o compose lê infra/.env sozinho: é o .env da pasta deste arquivo; nele deve estar ativo o
# bloco B do infra/.env.example.)
#
# Serviços e limites (SPEC 4.4 / 7): no total ≤ 1,5 CPU e ≤ 1,4 GB, ao lado do Minecraft.
#   livekit  SFU WebRTC             rede do host   1,0 CPU / 1 GB
#   api      concord-api            rede do host   0,25 CPU / 256 MB   só 127.0.0.1:3000
#   caddy    HTTPS (Let's Encrypt)  rede do host   0,25 CPU / 128 MB   portas 80 e 443 do host
#
# Rede — quem fala com quem:
#   - livekit usa network_mode: host: o WebRTC precisa das portas UDP 50000-50200 e TCP 7881
#     direto no host (publicar 201 portas por bridge é lento e frágil). A sinalização fica em
#     127.0.0.1:7880 e não é exposta: só o Caddy chega nela.
#   - api também usa network_mode: host e escuta SÓ em 127.0.0.1:3000 (HOST abaixo). O webhook
#     do LiveKit (http://127.0.0.1:3000/api/livekit/webhook) e o resync da presença
#     (LIVEKIT_API_URL=http://127.0.0.1:7880) ficam no loopback. Numa rede bridge o api teria de
#     falar com o host via host.docker.internal, e o firewall da imagem Oracle (REJECT no fim do
#     INPUT) recusa esse tráfego (EHOSTUNREACH 172.17.0.1:7880).
#   - caddy também usa network_mode: host: assim o Caddyfile da SPEC (4.5) funciona como está
#     (reverse_proxy para 127.0.0.1:3000 e 127.0.0.1:7880 do host) e ele escuta direto nas
#     portas 80/443 (TCP e, para HTTP/3, UDP 443) do host; por isso não há `ports:` nele.
#   - O servidor de Minecraft (porta 25565) NÃO é tocado: nenhum serviço aqui usa essa porta e
#     nada neste arquivo referencia o container/serviço dele. Nunca rode `docker compose down`
#     fora deste arquivo, `docker stop $(docker ps -q)` ou `docker system prune` na VM.
name: concord

services:
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: ['--config', '/etc/livekit.yaml']
    network_mode: host
    restart: unless-stopped
    cpus: '1.0'
    mem_limit: 1g
    environment:
      # Mesma convenção do start.ps1 e do compose de dev: id fixo "concord" + segredo do .env.
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-concord}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET em infra/.env}'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: concord-api:local
    restart: unless-stopped
    cpus: '0.25'
    mem_limit: 256m
    network_mode: host
    # Bloco B do infra/.env: LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, ROOMS, DOMAIN.
    env_file: .env
    # Fixadas aqui porque dependem de como o container é montado (vencem o env_file):
    environment:
      HOST: 127.0.0.1 # só loopback: o Caddy (rede do host) é a única porta de entrada
      PORT: '3000'
      TRUST_PROXY: '1' # o IP real do cliente vem no X-Forwarded-For do Caddy (rate limit)
      USERS_FILE: /data/users.json
      LIVEKIT_API_URL: http://127.0.0.1:7880
    volumes:
      - ./users.json:/data/users.json:ro
    depends_on:
      - livekit

  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    cpus: '0.25'
    mem_limit: 128m
    environment:
      DOMAIN: '${DOMAIN:?defina DOMAIN em infra/.env}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados Let's Encrypt: não apagar (evita re-emissão e rate limit)
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
