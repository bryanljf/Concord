# electron-builder configuration (Phase 6).
# Reference: https://www.electron.build/configuration

# Must equal APP_USER_MODEL_ID in src/main/index.ts, or Windows will not attribute
# notifications to the installed app.
appId: com.concord.desktop
productName: Concord

# Written into the packed package.json so Electron's `app.getName()` is "Concord" (userData in
# %APPDATA%\Concord) instead of the npm package name "@concord/desktop". Development runs
# keep the npm name, so nothing moves for people already using `pnpm dev`.
extraMetadata:
  productName: Concord

directories:
  output: release
  buildResources: resources

# electron-vite writes the bundles to out/; production node_modules are added automatically.
files:
  - out/**
  - package.json

# Native prebuilds must stay outside the asar so Node can dlopen them.
asarUnpack:
  - '**/node_modules/@concord/process-audio/**'
  # Native addon with its prebuilt .node binary (loaded through `bindings`).
  - '**/node_modules/loopback-capture/**'
  # "Now playing" (Windows media controls), loaded by the out/main/now-playing-worker.js utility
  # process: the adapter, the napi-rs loader and its per-platform binary package
  # (@coooookies/windows-smtc-monitor-win32-x64-msvc).
  - '**/node_modules/@concord/now-playing/**'
  - '**/node_modules/@coooookies/windows-smtc-monitor*/**'
  # FFI for the GPU priority call (src/main/gpu-priority.ts): koffi finds its binary in the sibling
  # @koromix/koffi-win32-x64 package.
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/koffi-*/**'

# Tray and notification icons are read from disk at runtime (src/main/resources.ts looks in
# <resourcesPath>/resources first).
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*.png'

# @concord/process-audio, @concord/now-playing and koffi ship prebuilt binaries; nothing is
# compiled while packaging.
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  # A 256x256 PNG; electron-builder converts it to .ico.
  icon: resources/icon.png

nsis:
  oneClick: true
  # Per-user install (no admin prompt), under %LOCALAPPDATA%\Programs\Concord.
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: Concord-Setup-${version}.${ext}
  shortcutName: Concord

# electron-updater reads this (as app-update.yml next to the asar) to find releases.
# GitHub user that hosts the repository; keep it in
# sync with "repository.url" in package.json.
publish:
  provider: github
  owner: bryanljf
  # Publish immediately (not as a draft) so electron-updater sees the release right away.
  releaseType: release
  repo: Concord
